name: Build Android (APK debug + AAB release)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/dazzling-cori-r2mpfy
      - main
    paths:
      - 'apps/app/**'
      - 'packages/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # ── Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java ────────────────────────────────────────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ── Android SDK ─────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── Signing keystore ────────────────────────────────────────────
      # Decodes KEYSTORE_BASE64 secret to a temp file used by Gradle.
      # Sets output 'available=true' when the secret is present so downstream
      # steps can gate on it — secrets cannot be used directly in if: conditions.
      - name: Decode keystore
        id: decode_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/canal-gospel.keystore
            echo "KEYSTORE_PATH=/tmp/canal-gospel.keystore" >> $GITHUB_ENV
            echo "available=true" >> $GITHUB_OUTPUT
            echo "Keystore decoded."
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "KEYSTORE_BASE64 not set — release AAB steps will be skipped."
          fi

      # ── Node + pnpm ─────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.15.4'

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Next.js static export ────────────────────────────────────────
      - name: Build Next.js static export (apps/app)
        working-directory: apps/app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          NEXT_PUBLIC_ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          NEXT_PUBLIC_WEB_URL: ${{ secrets.NEXT_PUBLIC_WEB_URL }}
        run: npx next build

      # ── Capacitor ───────────────────────────────────────────────────
      - name: Add Android platform
        working-directory: apps/app
        run: npx @capacitor/cli add android

      # ── Patch AndroidManifest — AdMob App ID ────────────────────────
      - name: Patch AndroidManifest — AdMob App ID
        working-directory: apps/app
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          APP_ID="${ADMOB_APP_ID:-ca-app-pub-3940256099942544~3347511713}"
          sed -i "s|<provider|<meta-data\n            android:name=\"com.google.android.gms.ads.APPLICATION_ID\"\n            android:value=\"${APP_ID}\" />\n\n        <provider|" \
            "$MANIFEST"
          echo "=== Manifest após patch ==="
          grep -A2 "APPLICATION_ID" "$MANIFEST"

      # ── Sync Capacitor ──────────────────────────────────────────────
      - name: Sync Capacitor to Android
        working-directory: apps/app
        run: npx @capacitor/cli sync android

      # ── Patch build.gradle — signing config ─────────────────────────
      # Injects a signingConfigs.release block (reads env vars at build time).
      # Only affects the release buildType; debug is unchanged.
      - name: Patch build.gradle — signing config
        working-directory: apps/app
        run: |
          python3 - <<'PYEOF'
          import re

          path = 'android/app/build.gradle'
          text = open(path).read()

          signing_block = """
              signingConfigs {
                  release {
                      def kp = System.getenv('KEYSTORE_PATH') ?: ''
                      if (kp) {
                          storeFile file(kp)
                          storePassword System.getenv('STORE_PASSWORD') ?: ''
                          keyAlias     System.getenv('KEY_ALIAS')    ?: ''
                          keyPassword  System.getenv('KEY_PASSWORD') ?: ''
                      }
                  }
              }
          """

          # Insert signingConfigs block before buildTypes
          text = text.replace('    buildTypes {', signing_block + '    buildTypes {', 1)

          # Wire signingConfig into the release buildType
          text = re.sub(
              r'(release\s*\{)(\s*)(minifyEnabled)',
              r'\1\2signingConfig signingConfigs.release\2\3',
              text,
              count=1
          )

          open(path, 'w').write(text)
          print("build.gradle patched — signingConfigs.release added")
          PYEOF

      # ── Gradle cache ────────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/app/android/**/*.gradle*', 'apps/app/android/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ── Build debug APK ─────────────────────────────────────────────
      - name: Build debug APK
        working-directory: apps/app/android
        run: ./gradlew assembleDebug --no-daemon

      # ── Build signed release AAB ────────────────────────────────────
      - name: Build signed release AAB
        if: steps.decode_keystore.outputs.available == 'true'
        working-directory: apps/app/android
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      # ── Upload artifacts ────────────────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: canal-gospel-debug-${{ github.run_number }}
          path: apps/app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload release AAB (Play Store)
        if: steps.decode_keystore.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: canal-gospel-release-${{ github.run_number }}
          path: apps/app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
          if-no-files-found: error
