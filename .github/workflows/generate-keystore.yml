name: Generate Keystore (run once to set up signing)

# Run this workflow ONCE to generate the signing keystore.
# Prerequisites — set these three secrets FIRST:
#   KEY_PASSWORD   (any strong password you choose)
#   STORE_PASSWORD (any strong password you choose — can be the same)
#   KEY_ALIAS      (e.g. canal-gospel)
#
# After this workflow completes:
#   1. Open the job Summary (gear icon → Summary tab)
#   2. Copy the long base64 string
#   3. Add it as secret KEYSTORE_BASE64
#
# NEVER run this again for the same app — it creates a NEW key that
# won't match your existing Play Store entry.

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate keystore
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          keytool -genkeypair \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 9125 \
            -keystore canal-gospel.keystore \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Canal Gospel, OU=Android, O=Canal Gospel, L=Rio de Janeiro, ST=RJ, C=BR" \
            -noprompt

          echo "Keystore gerado com sucesso."
          ENCODED=$(base64 -w 0 canal-gospel.keystore)
          echo "### ✅ Keystore gerado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Copie o valor abaixo e adicione como secret **KEYSTORE_BASE64**:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$ENCODED" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Após adicionar o secret, este workflow pode ser desabilitado." >> $GITHUB_STEP_SUMMARY

      - name: Upload keystore as artifact (backup — delete after saving the secret)
        uses: actions/upload-artifact@v4
        with:
          name: canal-gospel-keystore-BACKUP
          path: canal-gospel.keystore
          retention-days: 1
